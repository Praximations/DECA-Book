<!-- TITLE PAGE (not numbered): last year's cover layout, refined. Facts come from book.config.json.
     DECA requires: event name, school name, school address, city/state/ZIP, participants, date. -->
<section class="page front-page cover">
  <div class="corner tr corner--tr" data-bleed>
    <img src="assets/images/about-coast.jpg" alt="Coastal village and sea framed by olive trees">
    <div class="band"></div>
    <div class="fine"></div>
  </div>
  <div class="corner bl corner--bl" data-bleed>
    <img src="assets/images/aerial-view-of-olive-grove.jpg" alt="Olive grove seen from above">
    <div class="band"></div>
    <div class="fine"></div>
  </div>

  <span class="cv-arc" style="--r: 0.45in"></span>
  <span class="cv-arc" style="--r: 0.57in"></span>
  <span class="cv-arc" style="--r: 0.69in"></span>
  <span class="cv-arc" style="--r: 0.81in"></span>
  <span class="cv-arc" style="--r: 0.93in"></span>
  <span class="cv-arc" style="--r: 1.05in"></span>
  <span class="cv-arc" style="--r: 1.17in"></span>
  <span class="cv-arc" style="--r: 1.29in"></span>
  <span class="cv-arc" style="--r: 1.41in"></span>
  <span class="cv-arc" style="--r: 1.53in"></span>
  <span class="cv-arc" style="--r: 1.65in"></span>
  <span class="cv-arc" style="--r: 1.77in"></span>
  <span class="cv-arc" style="--r: 1.89in"></span>
  <span class="cv-arc" style="--r: 2.01in"></span>
  <span class="cv-arc" style="--r: 2.13in"></span>
  <span class="cv-arc" style="--r: 2.25in"></span>
  <span class="cv-arc" style="--r: 2.37in"></span>
  <span class="cv-arc" style="--r: 2.49in"></span>

  <span class="cv-date">{{date}}</span>

  <div class="cv-head">
    <p class="cv-event">Buying and Merchandising<br>Operations Research Event</p>
    <div class="cv-rule"></div>
    <h1 class="cv-name">BLIS FARMS</h1>
    <p class="cv-sub">{{subtitle}}</p>
  </div>

  <div class="cv-medallion">
    <div class="cv-ring"></div>
    <img class="cv-ring-photo" src="assets/images/aerial-view-of-greece.jpg" alt="The Greek coast from above">
    <div class="cv-ring-inner"></div>
    <div class="cv-disc"></div>
    <img class="cv-logo" src="assets/images/blis-farms-logo.svg" alt="Blis Farms logo">
  </div>

  <div class="cv-info">
    <span class="fr-label">Prepared for</span>
    <span class="cv-value">{{preparedFor}}</span>
    <span class="fr-label">Prepared by</span>
    <span class="cv-value">{{participants|dots}}</span>
    <span class="fr-label">School</span>
    <span class="cv-value">{{school}}<br>{{address}}, {{cityStateZip}}</span>
  </div>

  <div class="fr-frame"></div>
  <div class="fr-frame-inner"></div>
</section>
