<!-- TITLE PAGE (not numbered). Facts come from book.config.json.
     DECA requires: event name, school name, school address, city/state/ZIP, participants, date. -->
<section class="page cover">
  <div class="cover-paper" data-bleed></div>

  <div class="cover-scene" data-bleed>
    <!-- photo + products are flattened into one picture in the PowerPoint -->
    <div class="cover-stage" data-pptx="raster" data-pptx-flatten="FCFCFC">
      <div class="cover-backdrop">
        <img src="assets/images/home-terrace-background.jpg" alt="">
        <div class="veil"></div>
      </div>
      <div class="cover-products">
        <span class="shadow"></span>
        <img src="assets/images/Product-Photos-2.png" alt="Blis Farms products: TruOlive olive oil, fig jam, salts, black garlic and honey">
      </div>
    </div>
    <img class="cover-logo" src="assets/images/blis-farms-logo.svg" alt="Blis Farms logo">
  </div>

  <div class="cover-words">
    <span class="cover-eyebrow">Buying and Merchandising Operations Research Event<span class="line"></span></span>
    <h1 class="cover-title">{{projectTitle}}</h1>
    <div class="cover-rule"></div>
    <p class="cover-subtitle">{{subtitle}}</p>
  </div>

  <footer class="cover-meta">
    <div class="meta-item">
      <span class="meta-label">Prepared for</span>
      <span class="meta-value">{{preparedFor}}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Prepared by</span>
      <span class="meta-value">{{participants}}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">School</span>
      <span class="meta-value">{{school}}<br>{{address}}<br>{{cityStateZip}}</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Date</span>
      <span class="meta-value">{{date}}</span>
    </div>
  </footer>
</section>
