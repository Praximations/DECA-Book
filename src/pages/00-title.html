<!-- TITLE PAGE (not numbered). Fields come from book.config.json -->
<section class="page cover">
  <div class="cover-inner">
    <div class="event">{{event}}</div>
    <h1>{{projectTitle}}</h1>
    <p class="subtitle">{{subtitle}}</p>
    <div class="meta">
      <div class="stack"><span class="label">Business</span><span>{{business}}</span></div>
      <div class="stack"><span class="label">Participants</span><span>{{participants}}</span></div>
      <div class="stack"><span class="label">School</span><span>{{school}}<br>{{address}}<br>{{cityStateZip}}</span></div>
      <div class="stack"><span class="label">Date</span><span>{{date}}</span></div>
    </div>
  </div>
</section>
